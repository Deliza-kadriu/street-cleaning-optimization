name: Bug report
description: Report incorrect behavior with a reproducible example.
title: "[Bug]: "
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include commands, a small input example, and a random seed if relevant. Do not include secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include relevant errors or incorrect route results.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit or branch, operating system, runtime versions, and relevant dependencies.
    validations:
      required: true
